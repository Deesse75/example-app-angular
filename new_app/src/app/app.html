<div class='body'>
  <div class='tittle' >{{ result() }}</div>

  <div>
    <div>
        @for (item of [1, 2, 3]; track $index) {
          <app-app-button [value]="item" (outClick)="add($event)"></app-app-button>
        }
    </div>
    <div>
        @for (item of [4, 5, 6]; track $index) {
          <app-app-button [value]="item" (outClick)="add($event)"></app-app-button>
        }
    </div>
    <div>
        @for (item of [7, 8, 9]; track $index) {
          <app-app-button [value]="item" (outClick)="add($event)"></app-app-button>
        }
    </div>
  </div>

  <div></div>
</div>
